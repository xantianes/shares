<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доли по брендам</title>
  <style>
    :root {
      --bg: #eef0f7;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #8a90a2;
      --line: #e6e8f0;
      --accent: #e60000;
      --accent2: #ff5a4d;
      --input: #f5f6fb;
      --danger: #e5484d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14151c;
        --card: #1e2029;
        --text: #eceef5;
        --muted: #8b90a3;
        --line: #2b2e3b;
        --input: #272a36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px 40px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(40, 30, 100, 0.12);
      overflow: hidden;
    }
    .head {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 20px;
      background: linear-gradient(120deg, #1b1d27, #2c2f3d);
      border-bottom: 3px solid #e60000;
      color: #fff;
      overflow: hidden;
    }
    .head::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -70px;
      top: -110px;
      background: radial-gradient(circle, rgba(230, 0, 0, 0.45), transparent 70%);
    }
    .head > * { position: relative; z-index: 1; }
    .a1badge {
      position: relative;
      flex: none;
      min-width: 50px;
      height: 50px;
      padding: 0 8px;
      border-radius: 12px;
      background: #e60000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 21px;
      letter-spacing: -0.5px;
      overflow: hidden;
    }
    .a1badge img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      padding: 6px;
    }
    .head h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .head p { margin: 4px 0 0; opacity: 0.8; font-size: 14px; }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    select {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: var(--input);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 9px 10px;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    .ghost {
      flex: none;
      font: inherit;
      font-size: 18px;
      color: var(--muted);
      background: var(--input);
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      cursor: pointer;
    }
    .ghost:hover { color: var(--text); }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 14px 10px 8px;
      font-weight: 600;
    }
    th:first-child, td:first-child { padding-left: 16px; }
    th:last-child, td:last-child { padding-right: 16px; }
    td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
    input {
      width: 100%;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--input);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .brandcell { display: flex; align-items: center; gap: 10px; }
    .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 600;
    }
    .logo {
      flex: 0 0 40px;
      width: 40px;
      height: 34px;
      border-radius: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #8a90a2;
      overflow: visible;
    }
    .logo img { object-fit: contain; flex: none; }
    td.qty { width: 96px; }
    td.share { width: 120px; }
    .pct { font-weight: 700; font-size: 15px; text-align: right; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
    .bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.3s;
    }
    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px 10px;
      border-top: 2px solid var(--line);
      font-weight: 700;
    }
    .total span:last-child { font-size: 22px; color: var(--text); }
        .last { padding: 0 16px 6px; font-size: 13px; color: var(--muted); }
    .sold { padding: 0 16px 16px; font-size: 13px; color: var(--muted); }
    .sold b { color: var(--text); }
    .sold small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.5; }
    .save {
      display: block;
      width: 100%;
      margin-top: 14px;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .save:disabled { background: var(--line); color: var(--muted); cursor: default; }
    .status { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 18px; }
    .status.err { color: var(--danger); }
    .link {
      display: block;
      margin: 6px auto 0;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
    @media (max-width: 480px) {
      th, td { padding-left: 6px; padding-right: 6px; }
      th:first-child, td:first-child { padding-left: 10px; }
      th:last-child, td:last-child { padding-right: 10px; }
      td.qty { width: 78px; }
      td.share { width: 90px; }
      .logo { flex-basis: 34px; width: 34px; }
      input { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="a1badge">
          <span>A1</span>
          <img src="logos/a1.svg" alt=""
               onerror="if(!this.dataset.f){this.dataset.f=1;this.src='logos/a1.png'}else{this.remove()}">
        </div>
        <div>
          <h1>Доли по брендам</h1>
          <p>A1 · внесите количество и нажмите «Сохранить»</p>
        </div>
      </div>
      <div class="toolbar">
        <select id="month" aria-label="Месяц"></select>
        <button class="ghost" id="refresh" title="Обновить из таблицы">⟳</button>
      </div>
      <table>
        <thead>
          <tr><th>Бренд</th><th>Кол-во</th><th style="text-align:right">Доля</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="total"><span>Всего</span><span id="total">0</span></div>
      <div class="last" id="last"></div>
      <div class="sold" id="sold"></div>
    </div>
    <button class="save" id="save" disabled>Сохранить</button>
    <div class="status" id="status"></div>
    <button class="link" id="forget">Сменить пароль</button>
  </div>

  <script>
        const API = 'https://script.google.com/macros/s/AKfycbwvtNkFBzHjqsuMGfFVNrs9Uc_datYe6J9VnlASVKL_EbTsEbtV1WKPfipx6IAMpq9kyg/exec';
    const PW_KEY = 'brand-shares-pw';
    const MONTH_NAMES = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];

    // srcs: картинки пробуются по очереди; size: размер в пикселях; text: вместо картинки слово
    const LOGOS = {
      honor:   { srcs: ['logos/honor.svg', 'https://cdn.simpleicons.org/honor'], size: 34 },
      xiaomi:  { srcs: ['https://cdn.simpleicons.org/xiaomi'], size: 22 },
      huawei:  { srcs: ['https://cdn.simpleicons.org/huawei'], size: 22 },
      samsung: { srcs: ['https://cdn.simpleicons.org/samsung'], size: 38 },
      infinix: { text: 'infinix' },
      apple:   { srcs: ['https://cdn.simpleicons.org/apple'], size: 22 }
    };
    const ALIASES = {
      'хонор': 'honor',
      'сяоми': 'xiaomi',
      'хуавей': 'huawei',
      'самсунг': 'samsung',
      'инфиникс': 'infinix',
      'эпл': 'apple',
      'айфон': 'apple'
    };
    const OTHER_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="#8a90a2"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

    let rows = [];       // [{row, name, qty}]
    let saved = {};      // row -> qty, как в таблице
    let current = '';    // имя загруженного листа
    let shown = '';      // значение выбранного пункта списка
    let loading = false;

    const $ = id => document.getElementById(id);

    function cap(s) {
      s = (s || '').trim();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function fmtPct(n) { return n.toFixed(2).replace('.', ',') + ' %'; }

    function fmtDate(iso) {
      try {
        return new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch (e) { return ''; }
    }

    function setStatus(text, isError) {
      const s = $('status');
      s.textContent = text || '';
      s.className = 'status' + (isError ? ' err' : '');
    }

      function setLast(d) {
      $('last').textContent = d.updated
        ? 'Последнее изменение: ' + (d.by ? d.by + ' · ' : '') + fmtDate(d.updated)
        : 'Изменений пока не было';
      const box = $('sold');
      box.textContent = '';
      if (!d.updated || d.sold === null || d.sold === undefined) return;
      const head = document.createElement('span');
      head.textContent = 'Продано за день (' + d.day + '): ';
      const b = document.createElement('b');
      b.textContent = d.sold;
      box.appendChild(head);
      box.appendChild(b);
      if (d.parts && d.parts.length) {
        const small = document.createElement('small');
        small.textContent = d.parts.map(function (p) {
          return cap(p.n) + ' ' + (p.d > 0 ? '+' : '−') + Math.abs(p.d);
        }).join(' · ');
        box.appendChild(small);
      }
    }

    function isDirty() { return rows.some(r => r.qty !== saved[r.row]); }
    function refreshButtons() { $('save').disabled = loading || !isDirty(); }

    async function apiGet(params) {
      const r = await fetch(API + '?' + new URLSearchParams(params));
      return r.json();
    }
    async function apiPost(body) {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return r.json();
    }

    function isOther(name) {
      const k = (name || '').trim().toLowerCase();
      return k === 'другое' || k === 'прочее' || k === 'other';
    }

    function logoCfg(name) {
      const key = (name || '').trim().toLowerCase();
      return LOGOS[ALIASES[key] || key] || null;
    }

    function setLogo(box, name) {
      const letter = (name || '').trim().charAt(0).toUpperCase() || '•';
      const cfg = logoCfg(name);
      box.textContent = '';
      if (isOther(name)) { box.innerHTML = OTHER_ICON; return; }
      if (!cfg) { box.textContent = letter; return; }
      if (cfg.text) {
        box.innerHTML = '<span style="font-size:11px;font-weight:800;color:#111;letter-spacing:-0.2px">' + cfg.text + '</span>';
        return;
      }
      let n = 0;
      const img = new Image();
      img.alt = '';
      img.style.width = cfg.size + 'px';
      img.style.height = cfg.size + 'px';
      img.onerror = function () {
        if (img.parentNode !== box) return;
        n++;
        if (n < cfg.srcs.length) img.src = cfg.srcs[n];
        else box.textContent = letter;
      };
      img.src = cfg.srcs[0];
      box.appendChild(img);
    }

    function render() {
      const tbody = $('rows');
      tbody.innerHTML = '';
      rows.forEach((row, i) => {
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        const cell = document.createElement('div');
        cell.className = 'brandcell';
        const logo = document.createElement('div');
        logo.className = 'logo';
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = cap(row.name);
        cell.appendChild(logo);
        cell.appendChild(nm);
        tdName.appendChild(cell);
        setLogo(logo, row.name);

        const tdQty = document.createElement('td');
        tdQty.className = 'qty';
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.inputMode = 'numeric';
        inp.min = '0';
        inp.placeholder = '0';
        inp.value = row.qty || '';
        inp.addEventListener('input', function () {
          rows[i].qty = Math.max(0, Number(inp.value) || 0);
          update();
          refreshButtons();
        });
        tdQty.appendChild(inp);

        const tdShare = document.createElement('td');
        tdShare.className = 'share';
        tdShare.innerHTML = '<div class="pct" id="pct' + i + '"></div><div class="bar"><span id="bar' + i + '"></span></div>';

        tr.appendChild(tdName);
        tr.appendChild(tdQty);
        tr.appendChild(tdShare);
        tbody.appendChild(tr);
      });
      update();
      refreshButtons();
    }

    function update() {
      const total = rows.reduce((s, r) => s + (r.qty || 0), 0);
      $('total').textContent = total;
      rows.forEach((row, i) => {
        const pct = total ? (row.qty || 0) / total * 100 : 0;
        $('pct' + i).textContent = fmtPct(pct);
        $('bar' + i).style.width = pct + '%';
      });
    }

    async function loadMonth(name) {
      loading = true;
      refreshButtons();
      setStatus('Загрузка…');
      try {
        const d = await apiGet({ action: 'get', sheet: name });
        if (d.error) throw new Error(d.error);
        current = d.sheet;
        shown = name;
        rows = d.rows;
        saved = {};
        rows.forEach(r => { saved[r.row] = r.qty; });
        $('month').value = name;
        render();
        setLast(d);
        setStatus('');
      } catch (e) {
        $('month').value = shown;
        setStatus('Не удалось загрузить: ' + e.message, true);
      } finally {
        loading = false;
        refreshButtons();
      }
    }

    async function save() {
      let pw = '';
      try { pw = localStorage.getItem(PW_KEY) || ''; } catch (e) {}
      if (!pw) {
        pw = (prompt('Введите ваш пароль для сохранения:') || '').trim();
        if (!pw) return;
      }
      loading = true;
      refreshButtons();
      setStatus('Сохраняю…');
      try {
        const res = await apiPost({
          password: pw,
          sheet: current,
          values: rows.map(r => ({ row: r.row, name: r.name, qty: r.qty }))
        });
        if (res.error) {
          if (res.error === 'Неверный пароль') {
            try { localStorage.removeItem(PW_KEY); } catch (e) {}
          }
          setStatus(res.error, true);
          return;
        }
        try { localStorage.setItem(PW_KEY, pw); } catch (e) {}
        rows = res.rows;
        saved = {};
        rows.forEach(r => { saved[r.row] = r.qty; });
        render();
        setLast(res);
        setStatus(res.changed > 0
          ? 'Сохранено ✓ (изменено значений: ' + res.changed + ')'
          : 'Изменений нет: в таблице уже такие же цифры');
      } catch (e) {
        setStatus('Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.', true);
      } finally {
        loading = false;
        refreshButtons();
      }
    }

    async function init() {
      setStatus('Загрузка…');
      let months = [];
      try {
        const m = await apiGet({ action: 'months' });
        months = (m.months || []).slice().reverse();
      } catch (e) {
        setStatus('Не удалось связаться с таблицей. Проверьте интернет.', true);
        return;
      }
      if (!months.length) {
        setStatus('В таблице не найдено листов с месяцами.', true);
        return;
      }
      const sel = $('month');
      months.forEach(function (name) {
        const o = document.createElement('option');
        o.value = name;
        o.textContent = cap(name);
        sel.appendChild(o);
      });
      const now = new Date();
      const want = MONTH_NAMES[now.getMonth()] + ' ' + now.getFullYear();
      const def = months.find(function (n) { return n.trim().toLowerCase() === want; }) || months[0];
      await loadMonth(def);
    }

    $('month').addEventListener('change', function () {
      const target = this.value;
      if (isDirty() && !confirm('Есть несохранённые изменения. Перейти на другой месяц без сохранения?')) {
        this.value = shown;
        return;
      }
      loadMonth(target);
    });
    $('refresh').addEventListener('click', function () {
      if (isDirty() && !confirm('Есть несохранённые изменения. Обновить без сохранения?')) return;
      if (shown) loadMonth(shown);
    });
    $('save').addEventListener('click', save);
    $('forget').addEventListener('click', function () {
      try { localStorage.removeItem(PW_KEY); } catch (e) {}
      setStatus('Пароль сброшен. При следующем сохранении введите новый.');
    });
    window.addEventListener('beforeunload', function (e) {
      if (isDirty()) { e.preventDefault(); e.returnValue = ''; }
    });

    init();
  </script>
</body>
</html>
